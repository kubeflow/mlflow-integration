name: Publish Helm Chart

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to publish from
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  CHART_PATH: charts/mlflow
  OCI_REGISTRY: oci://ghcr.io/kubeflow/charts

jobs:
  publish:
    if: github.repository == 'kubeflow/mlflow-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Lint chart profiles
        run: |
          helm lint "$CHART_PATH" \
            --namespace default \
            --values "$CHART_PATH/ci/values-standalone.yaml"
          helm lint "$CHART_PATH" \
            --namespace kubeflow \
            --values "$CHART_PATH/ci/values-multi-user.yaml"
          helm lint "$CHART_PATH" \
            --namespace mlflow-system \
            --values "$CHART_PATH/ci/values-workloads-enabled.yaml"

      - name: Package chart
        id: package
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"

          helm package "$CHART_PATH" \
            --destination dist \
            --version "$version"
          echo "package=dist/mlflow-${version}.tgz" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to GHCR
        run: helm push "${{ steps.package.outputs.package }}" "$OCI_REGISTRY"

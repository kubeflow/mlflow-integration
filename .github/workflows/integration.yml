name: Integration tests

on:
  pull_request:
    paths:
      - "mlflow_kubernetes_plugins/**"
      - "charts/mlflow/**"
      - "tests/integration/**"
      - "tests/kind/**"
      - "hack/kind-e2e.sh"
      - "pyproject.toml"
      - "uv.lock"
      - "Makefile"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: mlflow-integration
          wait: 2m
      - name: Install test dependencies
        run: uv sync --extra dev
      - name: Run MLflow functional tests
        run: KIND_CLUSTER_NAME=mlflow-integration make kind-e2e
      - name: Upload test results and diagnostics
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: mlflow-integration-results
          path: test-results/
          if-no-files-found: ignore

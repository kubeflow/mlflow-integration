{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mlflow.fullname" . }}
  namespace: {{ include "mlflow.namespace" . }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mlflow.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.mlflow.port }}
        {{- if .Values.istio.enabled }}
        - protocol: TCP
          port: 15020
        - protocol: TCP
          port: 15021
        - protocol: TCP
          port: 15090
        {{- end }}
      from:
        - podSelector: {}
        - namespaceSelector: {}
  egress:
    {{- if .Values.networkPolicy.egressRules }}
    {{- toYaml .Values.networkPolicy.egressRules | nindent 4 }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 8443
    {{- if .Values.istio.enabled }}
    - ports:
        - protocol: TCP
          port: 15012
        - protocol: TCP
          port: 15014
    {{- end }}
    - ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 3306
    - ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 8333
        - protocol: TCP
          port: 8334
    {{- end }}
    {{- with .Values.networkPolicy.additionalEgressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

{{- if and .Values.istio.enabled .Values.istio.virtualService.enabled }}
{{- if and (not .Values.istio.virtualService.http) (not .Values.mlflow.staticPrefix) }}
{{- fail "mlflow.staticPrefix must be set when using the default VirtualService routing" }}
{{- end }}
{{- $staticPrefix := .Values.mlflow.staticPrefix | default "/mlflow" | trimSuffix "/" -}}
{{- if not $staticPrefix -}}
{{- $staticPrefix = "/" -}}
{{- end }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "mlflow.fullname" . }}
  namespace: {{ include "mlflow.namespace" . }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
  {{- with .Values.istio.virtualService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.istio.virtualService.gateways }}
  gateways:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.istio.virtualService.hosts }}
  hosts:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  http:
    {{- if .Values.istio.virtualService.http }}
    {{- toYaml .Values.istio.virtualService.http | nindent 4 }}
    {{- else }}
    - match:
        - uri:
            {{- if eq $staticPrefix "/" }}
            prefix: /
            {{- else }}
            prefix: {{ printf "%s/" $staticPrefix }}
            {{- end }}
        {{- if ne $staticPrefix "/" }}
        - uri:
            exact: {{ $staticPrefix }}
        {{- end }}
      route:
        - destination:
            host: {{ include "mlflow.service.fullhost" . }}
            port:
              number: {{ .Values.service.port }}
    {{- end }}
{{- end }}

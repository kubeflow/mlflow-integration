{{- if and (not .Values.mlflow.backendStoreUri) (empty .Values.mlflow.backendStoreUriFrom) }}
{{- fail "mlflow.backendStoreUri or mlflow.backendStoreUriFrom must be set" }}
{{- end }}
{{- if and .Values.mlflow.serveArtifacts (hasPrefix "file://" .Values.mlflow.artifactsDestination) (not .Values.storage.enabled) }}
{{- fail "storage.enabled must be true when mlflow.artifactsDestination uses file:// and mlflow.serveArtifacts is enabled" }}
{{- end }}
{{- with .Values.mlflow.backendStoreUriFrom }}
{{- if not .secretKeyRef }}
{{- fail "mlflow.backendStoreUriFrom.secretKeyRef must include non-empty 'name' and 'key'" }}
{{- else if or (not .secretKeyRef.name) (not .secretKeyRef.key) }}
{{- fail "mlflow.backendStoreUriFrom.secretKeyRef must include non-empty 'name' and 'key'" }}
{{- end }}
{{- end }}
{{- with .Values.mlflow.registryStoreUriFrom }}
{{- if not .secretKeyRef }}
{{- fail "mlflow.registryStoreUriFrom.secretKeyRef must include non-empty 'name' and 'key'" }}
{{- else if or (not .secretKeyRef.name) (not .secretKeyRef.key) }}
{{- fail "mlflow.registryStoreUriFrom.secretKeyRef must include non-empty 'name' and 'key'" }}
{{- end }}
{{- end }}
{{- $healthPrefix := .Values.mlflow.staticPrefix | trimSuffix "/" -}}
{{- $portName := include "mlflow.portName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mlflow.fullname" . }}
  namespace: {{ include "mlflow.namespace" . }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if .Values.storage.enabled }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "mlflow.serverSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mlflow.serverSelectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mlflow.fullname" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.resourceClaims }}
      resourceClaims:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        {{- if .Values.storage.enabled }}
        - name: mlflow-storage
          persistentVolumeClaim:
            claimName: {{ include "mlflow.fullname" . }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: mlflow-tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            defaultMode: {{ .Values.tls.defaultMode | default 420 }}
        {{- end }}
        {{- include "mlflow.caBundleVolumes" . | nindent 8 }}
        {{- if .Values.metrics.enabled }}
        - name: metrics
          emptyDir:
            sizeLimit: 100Mi
        {{- end }}
        {{- if .Values.traceArchival.enabled }}
        - name: trace-archival-config
          configMap:
            name: {{ include "mlflow.traceArchival.configMapName" . }}
        {{- end }}
      {{- include "mlflow.caBundleInitContainers" . | nindent 6 }}

      containers:
        - name: mlflow
          image: {{ include "mlflow.image" . }}
          {{- if .Values.image.pullPolicy }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          command:
            - mlflow
          args:
            - server
            {{- if .Values.mlflow.serveArtifacts }}
            - --serve-artifacts
            - --artifacts-destination={{ .Values.mlflow.artifactsDestination }}
            {{- else }}
            - --no-serve-artifacts
            {{- end }}
            {{- if .Values.mlflow.defaultArtifactRoot }}
            - --default-artifact-root={{ .Values.mlflow.defaultArtifactRoot }}
            {{- end }}
            - --app-name=kubernetes-auth
            - --enable-workspaces
            - --workspace-store-uri={{ .Values.mlflow.workspaceStoreUri }}
            - --host=0.0.0.0
            - --port={{ .Values.mlflow.port }}
            - --workers={{ .Values.mlflow.workers }}
            {{- if .Values.tls.enabled }}
            - "--uvicorn-opts=--ssl-keyfile=/etc/tls/private/tls.key --ssl-certfile=/etc/tls/private/tls.crt --proxy-headers"
            {{- end }}
            - --allowed-hosts
            - {{ include "mlflow.allowedHosts" . | quote }}
            {{- if .Values.mlflow.staticPrefix }}
            - --static-prefix={{ .Values.mlflow.staticPrefix }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --expose-prometheus=/prometheus
            {{- end }}
          env:
            - name: MLFLOW_DISABLE_TELEMETRY
              value: "true"
            - name: MLFLOW_SERVER_ENABLE_JOB_EXECUTION
              value: "false"
            {{- if .Values.traceArchival.enabled }}
            - name: MLFLOW_TRACE_ARCHIVAL_CONFIG
              value: "/etc/mlflow/trace-archival.yaml"
            {{- end }}
            - name: MLFLOW_BACKEND_STORE_URI
              {{- if .Values.mlflow.backendStoreUriFrom }}
              valueFrom:
                {{- toYaml .Values.mlflow.backendStoreUriFrom | nindent 16 }}
              {{- else }}
              value: {{ .Values.mlflow.backendStoreUri | quote }}
              {{- end }}
            {{- if or .Values.mlflow.registryStoreUri .Values.mlflow.registryStoreUriFrom }}
            - name: MLFLOW_REGISTRY_STORE_URI
              {{- if .Values.mlflow.registryStoreUriFrom }}
              valueFrom:
                {{- toYaml .Values.mlflow.registryStoreUriFrom | nindent 16 }}
              {{- else }}
              value: {{ .Values.mlflow.registryStoreUri | quote }}
              {{- end }}
            {{- end }}
            - name: MLFLOW_K8S_AUTH_AUTHORIZATION_MODE
              value: {{ .Values.mlflow.authorizationMode | quote }}
            {{- if .Values.mlflow.corsAllowedOrigins }}
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: {{ .Values.mlflow.corsAllowedOrigins | quote }}
            {{- end }}
            {{- if .Values.mlflow.workspaceLabelSelector }}
            - name: MLFLOW_K8S_WORKSPACE_LABEL_SELECTOR
              value: {{ .Values.mlflow.workspaceLabelSelector | quote }}
            {{- end }}
            - name: MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE
              value: "false"
            {{- if .Values.caBundle.configMaps }}
            - name: SSL_CERT_FILE
              value: {{ .Values.caBundle.outputPath | quote }}
            - name: REQUESTS_CA_BUNDLE
              value: {{ .Values.caBundle.outputPath | quote }}
            - name: CURL_CA_BUNDLE
              value: {{ .Values.caBundle.outputPath | quote }}
            - name: AWS_CA_BUNDLE
              value: {{ .Values.caBundle.outputPath | quote }}
            - name: PGSSLROOTCERT
              value: {{ .Values.caBundle.outputPath | quote }}
            - name: PGSSLMODE
              value: "verify-full"
            - name: MLFLOW_MYSQL_SSL_CA
              value: {{ .Values.caBundle.outputPath | quote }}
            - name: MLFLOW_S3_IGNORE_TLS
              value: "false"
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              {{- if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
            {{- end }}
          {{- if .Values.envFrom }}
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ $portName }}
              containerPort: {{ .Values.mlflow.port }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.storage.enabled }}
            - name: mlflow-storage
              mountPath: /mlflow
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: mlflow-tls
              mountPath: /etc/tls/private
              readOnly: true
            {{- end }}
            {{- if .Values.caBundle.configMaps }}
            - name: combined-ca-bundle
              mountPath: {{ dir .Values.caBundle.outputPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              mountPath: /prometheus
            {{- end }}
            {{- if .Values.traceArchival.enabled }}
            - name: trace-archival-config
              mountPath: /etc/mlflow
              readOnly: true
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ printf "%s/health" $healthPrefix }}
              port: {{ $portName }}
              scheme: {{ include "mlflow.probeScheme" . }}
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ printf "%s/health" $healthPrefix }}
              port: {{ $portName }}
              scheme: {{ include "mlflow.probeScheme" . }}
            initialDelaySeconds: 5
            timeoutSeconds: 1
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

        {{- if .Values.caBundle.configMaps }}
        - name: ca-bundle-watcher
          image: {{ include "mlflow.image" . }}
          {{- if .Values.image.pullPolicy }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
{{ include "mlflow.caBundleFunctions" . | indent 14 }}

              LAST_CHECKSUM=$(compute_checksum)
              echo "CA bundle watcher started"
              while true; do
                sleep "$CA_BUNDLE_WATCH_INTERVAL"
                CURRENT_CHECKSUM=$(compute_checksum)
                if [ "$CURRENT_CHECKSUM" != "$LAST_CHECKSUM" ]; then
                  echo "CA bundle change detected"
                  if combine_ca_bundles; then
                    LAST_CHECKSUM="$CURRENT_CHECKSUM"
                  fi
                fi
              done
          env:
            - name: CA_BUNDLE_WATCH_INTERVAL
              value: "{{ .Values.caBundle.watchInterval | default 30 }}"
            - name: CA_BUNDLE_FILE_PATHS
              value: {{ include "mlflow.caBundleFilePaths" . | quote }}
            - name: CA_BUNDLE_MOUNT_PATHS
              value: {{ include "mlflow.caBundleMountPaths" . | quote }}
            - name: CA_BUNDLE_OUTPUT
              value: {{ .Values.caBundle.outputPath | quote }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: combined-ca-bundle
              mountPath: {{ dir .Values.caBundle.outputPath }}
            {{- range $i, $cm := .Values.caBundle.configMaps }}
            - name: ca-bundle-{{ $i }}
              mountPath: {{ $cm.mountPath }}
              readOnly: true
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
        {{- end }}
